name: notify-done

# 通用「运维通知」工作流：复用项目内既有的 Resend SMTP 通道与同一套 Secrets。
# 本次由 push（仅本文件变更且 commit message 含 notify-done）自动触发一次完成通知；
# 之后可在 Actions 页手动 workflow_dispatch 复用，不会再自动发送。
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/notify_done.yml
  workflow_dispatch: {}

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'notify-done')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send completion email via existing Resend path
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python - <<'PY'
          import os
          from buy_strategy import send_resend_email

          subject = "【完成】金价监控已停止 · 基金周五收益播报已上线"
          html = """
          <html>
          <body style="margin:0;padding:0;background:#f0f2f5;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
          <table width="100%" cellpadding="0" cellspacing="0" style="background:#f0f2f5;padding:24px 0;">
          <tr><td align="center">
          <table width="640" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">

            <tr><td style="background:linear-gradient(135deg,#1e293b,#334155);padding:30px 40px;text-align:center;">
              <h1 style="margin:0;color:#ffffff;font-size:22px;font-weight:700;">全部完成，可以放心休息了</h1>
              <p style="margin:8px 0 0;color:#94a3b8;font-size:13px;">金价监控与基金净值播报 · 收尾通知</p>
            </td></tr>

            <tr><td style="padding:28px 40px 8px;">
              <h2 style="margin:0 0 12px;font-size:16px;color:#1e293b;">本次交付</h2>
              <p style="margin:0 0 10px;padding:12px 16px;background:#f8fafc;border-radius:10px;font-size:13px;color:#374151;line-height:1.7;">
                <b>1. 金价监控已停止</b> — <code>monitor.py</code> 中 <code>ENABLE_GOLD_MONITOR = False</code> 为唯一控制点；策略脚本与工作流均复用该开关，改回 <code>True</code> 即恢复。关闭期间不采集、不写日志、不发金价邮件。
              </p>
              <p style="margin:0 0 10px;padding:12px 16px;background:#f8fafc;border-radius:10px;font-size:13px;color:#374151;line-height:1.7;">
                <b>2. 基金净值播报已上线</b> — 每周六 09:00 / 12:00 / 18:00 查询上周五净值（周日、周一补发兜底），对比基准固定为<b>周四</b>；周四无净值时顺延并标注。净值未公布则跳过等待补发，同一周五只发一次。
              </p>
              <p style="margin:0;padding:12px 16px;background:#f8fafc;border-radius:10px;font-size:13px;color:#374151;line-height:1.7;">
                <b>3. 周五收益直接报出</b> — 邮件主题与正文首屏显示「周五当日收益」，口径为 <code>份额 × (周五净值 − 周四净值)</code>；填了本金还会给出当前市值与累计收益。涨跌配色遵循国内习惯（红涨绿跌）。
              </p>
            </td></tr>

            <tr><td style="padding:20px 40px;">
              <div style="padding:14px 16px;border-radius:10px;background:#fffbeb;border-left:4px solid #f59e0b;color:#92400e;font-size:13px;line-height:1.7;">
                <b>唯一待办（不急，休息好再处理）</b>：在 <code>fund_nav_notify.py</code> 配置区填写 <code>FUND_SHARES</code>（份额）与 <code>FUND_COST_AMOUNT</code>（买入金额），或在仓库 Settings → Secrets 配置同名两个值。填写前邮件仍会正常推送涨跌幅，收益区显示配置提示。
              </div>
            </td></tr>

            <tr><td style="padding:0 40px 26px;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border-radius:12px;">
                <tr><td style="padding:16px 20px;font-size:13px;color:#374151;line-height:1.8;">
                  <b>同步状态</b>：代码已全部推送至 GitHub，本地与远程一致（HEAD <code>0f7bc959</code>）。<br>
                  <b>验证</b>：三个 py 文件编译、两个 workflow YAML、周四基准与顺延、收益计算、HTML 结构均通过。<br>
                  <b>远程冲突处理</b>：变基时保留了远程对 <code>ENABLE_EMAIL_NOTIFICATION = False</code> 的设置，已确认不影响基金播报邮件。
                </td></tr>
              </table>
            </td></tr>

            <tr><td style="padding:18px 40px;background:#f8fafc;text-align:center;border-top:1px solid #e5e7eb;">
              <p style="margin:0;font-size:12px;color:#6b7280;">本邮件复用项目内既有的 Resend SMTP 通道与 <code>EMAIL_TO</code>，与每周六的基金播报走同一条路径。</p>
              <p style="margin:6px 0 0;font-size:12px;color:#9ca3af;">自动化脚本生成 · 仅供参考，不构成投资建议 · 晚安</p>
            </td></tr>

          </table>
          </td></tr>
          </table>
          </body>
          </html>
          """.strip()

          ok = send_resend_email(
              subject,
              html,
              os.getenv("EMAIL_TO", "").strip(),
              sender_name="项目运维通知",
          )
          if not ok:
              raise SystemExit("[error] 完成通知邮件发送失败（请检查 Secrets 配置）")
          print("[ok] 完成通知已通过项目内 Resend 通道发送")
          PY
