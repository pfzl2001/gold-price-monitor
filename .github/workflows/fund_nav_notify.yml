name: fund-nav-notify

# 每周五基金净值播报（独立于金价监控）
# GitHub Actions 的 cron 使用 UTC，北京时间 = UTC + 8
on:
  schedule:
    # 周五北京时间 20:00 / 22:00 —— 净值若当日已披露，此时推送
    - cron: "0 12,14 * * 5"
    # 净值多为 T+1 披露：周六北京时间 09:00 / 12:00 补发
    - cron: "0 1,4 * * 6"
    # 极端延迟（节假日顺延）：周一北京时间 09:00 再补一次
    - cron: "0 1 * * 1"
  workflow_dispatch: {}
  repository_dispatch:
    types: [trigger-fund-nav]

concurrency:
  group: fund-nav-notify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 需要写权限来提交防重复状态文件
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fund NAV weekly report
        env:
          GOLD_TZ: "Asia/Shanghai"
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # 如官网证书链异常可设为 1 跳过校验（默认 0，脚本会自动降级重试）
          NAV_SKIP_SSL_VERIFY: "0"
        run: python fund_nav_notify.py

      - name: Commit and push notification state
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f fund_nav_state.json ]; then
            git add fund_nav_state.json
          fi
          git diff --staged --quiet || git commit -m "📈 Update fund NAV notify state [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash || true
            if git push; then
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "Push failed after retries"
