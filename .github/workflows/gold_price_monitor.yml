name: gold-price-monitor

on:
  # 外部触发器（主要调度方式，通过 cron-job.org 调用）
  repository_dispatch:
    types: [trigger-monitor]
  schedule:
    # 兜底：工作日北京时间 9:00-23:00 每小时一次
    - cron: "0 1-15 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: gold-price-monitor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 需要写权限来 commit log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 开关来自 monitor.py 的 ENABLE_GOLD_MONITOR；为 False 时跳过全部金价步骤。
      - name: Read gold monitor switch
        id: gold_switch
        run: |
          if grep -Eq '^ENABLE_GOLD_MONITOR[[:space:]]*=[[:space:]]*True' monitor.py; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "金价监控开关：开启"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "金价监控开关：关闭，跳过金价采集与策略分析"
          fi

      - name: Run monitor (one-shot)
        if: steps.gold_switch.outputs.enabled == 'true'
        env:
          GOLD_TZ: "Asia/Shanghai"
          GOLD_CODE: "CZB-JCJ"
          TRUST_ENV: "0"
        run: python monitor.py

      - name: Run buy strategy analysis
        if: steps.gold_switch.outputs.enabled == 'true'
        env:
          GOLD_TZ: "Asia/Shanghai"
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SUBJECT: "🔔 金价买入提醒"
          NOTIFY_COOLDOWN_HOURS: "2"    # 两次通知之间最少间隔（小时）
          NOTIFY_DROP_PCT: "0.5"        # 价格需比上次通知价低多少%才再次通知
        run: python buy_strategy.py > buy_strategy.log 2>&1 || true

      - name: Show latest price query
        if: steps.gold_switch.outputs.enabled == 'true'
        run: |
          echo "📊 最新查询结果:"
          tail -n 1 monitor.log || echo "暂无记录"
          echo ""
          echo "🎯 买入策略分析结果:"
          cat buy_strategy.log || echo "暂无 buy_strategy 输出"

      - name: Commit and push log
        if: steps.gold_switch.outputs.enabled == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 日志是策略分析的历史数据源；被 .gitignore 忽略，恢复监控时需 -f 强制入库
          git add -f monitor.log buy_strategy.log 2>/dev/null || true
          if [ -f buy_notify_state.json ]; then
            git add -f buy_notify_state.json
          fi
          git diff --staged --quiet || git commit -m "📊 Update gold price log [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash || true
            if git push; then
              exit 0
            fi
            sleep $((i * 2))
          done
          echo "Push failed after retries"
